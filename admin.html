<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Instructor CESBA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;}
        input, textarea, pre, code, .copy-btn { -webkit-user-select: text; -moz-user-select: text; -ms-user-select: text; user-select: text; }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center min-h-screen">

    <div class="max-w-xl w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
        <h1 class="text-3xl font-bold text-orange-400 mb-2"><i class="fa-solid fa-gamepad"></i> Centro de Mando</h1>
        <p class="text-slate-400 mb-6 text-sm">Controla las pantallas de tus alumnos en tiempo real.</p>

        <!-- Contraseña -->
        <div class="mb-6 bg-slate-900 p-4 rounded-xl border border-slate-700 flex gap-3">
            <i class="fa-solid fa-key text-slate-500 mt-3"></i>
            <input type="password" id="admin-pass" placeholder="Contraseña de Administrador" class="flex-1 bg-transparent outline-none text-white font-mono tracking-widest">
        </div>

        <div class="grid grid-cols-1 gap-3">
            <button onclick="setStep(0)" class="p-4 bg-red-900/50 hover:bg-red-600 border border-red-500/30 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span class="text-red-200">0. BLOQUEAR TODO (Pantalla de Espera)</span><i class="fa-solid fa-lock group-hover:scale-125 transition text-red-300"></i>
            </button>
            <button onclick="setStep(1)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>1. Liberar: Requisitos Previos</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(2)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>2. Liberar: Fase 1 y 2 (Identidad y GitHub)</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(3)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>3. Liberar: Fase 3 (Cloudflare Pages CI/CD)</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(4)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>4. Liberar: Fase 4 (Ciberseguridad WAF)</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(5)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>5. Liberar: Fase 5 (Serverless Workers + KV)</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(6)" class="p-4 bg-purple-900/50 hover:bg-purple-600 border border-purple-500/30 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span class="text-purple-200">6. Liberar: Reto Pro y PDF Final</span><i class="fa-solid fa-trophy group-hover:scale-125 transition text-purple-300"></i>
            </button>
            <!-- BOTÓN DEL BONUS VIP -->
            <button onclick="setStep(7)" class="p-4 bg-yellow-900/40 hover:bg-yellow-600 border border-yellow-500/50 rounded-xl text-left font-bold transition flex justify-between items-center group mt-2 shadow-[0_0_15px_rgba(234,179,8,0.2)]">
                <span class="text-yellow-400">7. Liberar BONUS VIP: Dashboard CRUD</span><i class="fa-solid fa-star group-hover:scale-125 transition text-yellow-400"></i>
            </button>
        </div>

        <div id="status" class="mt-6 text-center font-mono text-sm text-emerald-400 h-6"></div>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU SCRIPT DE GOOGLE
        const API_URL = "https://script.google.com/macros/s/AKfycbyCP0zlB95ADZk1kOZ5qZFh7LSHfMUwi0S3bPFLXai2TXCQw_guuO3-PpvGf3Y_LMPPBQ/exec";

        async function setStep(stepNumber) {
            const pass = document.getElementById('admin-pass').value;
            const status = document.getElementById('status');
            
            if (!pass) {
                status.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-circle-exclamation"></i> Ingresa la contraseña primero.</span>`;
                return;
            }

            status.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Actualizando Mando Central...`;
            
            try {
                const req = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "set_step", new_step: stepNumber, password: pass })
                });
                const res = await req.json();
                
                if (res.status === "success") {
                    status.innerHTML = `<i class="fa-solid fa-check"></i> ¡Pantallas de alumnos ajustadas al Paso ${stepNumber}!`;
                } else {
                    status.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-circle-xmark"></i> ${res.message}</span>`;
                }
            } catch (e) {
                status.innerHTML = `<span class="text-red-400">Error de red. Intenta de nuevo.</span>`;
            }
        }
    </script>
    <!-- SCRIPT ANTI-INSPECCIÓN -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.shiftKey && e.key === 'J') || (e.ctrlKey && e.shiftKey && e.key === 'C') || (e.ctrlKey && (e.key === 'u' || e.key === 'U')) || (e.ctrlKey && (e.key === 's' || e.key === 'S')) || (e.ctrlKey && (e.key === 'p' || e.key === 'P'))) {
                e.preventDefault(); return false;
            }
        });
    </script>
</body>
</html>
