<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Instructor CESBA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #0f172a; color: white; font-family: sans-serif; }</style>
</head>
<body class="p-8 flex flex-col items-center">

    <div class="max-w-2xl w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
        <h1 class="text-3xl font-bold text-orange-400 mb-2"><i class="fa-solid fa-gamepad"></i> Panel de Mando</h1>
        <p class="text-slate-400 mb-8">Controla el ritmo del taller. Los alumnos no verán el siguiente paso hasta que tú lo liberes aquí.</p>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="setStep(1)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>1. Liberar: GitHub y Repositorios</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(2)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>2. Liberar: CI/CD y Cloudflare Pages</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(3)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>3. Liberar: Hardening WAF</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(4)" class="p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span>4. Liberar: Serverless Workers + KV</span><i class="fa-solid fa-unlock group-hover:scale-125 transition"></i>
            </button>
            <button onclick="setStep(5)" class="p-4 bg-slate-700 hover:bg-purple-600 rounded-xl text-left font-bold transition flex justify-between items-center group">
                <span class="text-purple-300">5. Liberar: Reto Pro y Generación de PDF</span><i class="fa-solid fa-trophy group-hover:scale-125 transition text-purple-300"></i>
            </button>
        </div>

        <div id="status" class="mt-6 text-center font-mono text-sm text-emerald-400 h-6"></div>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU SCRIPT DE GOOGLE
        const API_URL = "https://script.google.com/macros/s/AKfycbyCP0zlB95ADZk1kOZ5qZFh7LSHfMUwi0S3bPFLXai2TXCQw_guuO3-PpvGf3Y_LMPPBQ/exec";

        async function setStep(stepNumber) {
            const status = document.getElementById('status');
            status.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Actualizando todas las pantallas a Paso ${stepNumber}...`;
            
            try {
                const req = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "set_step", new_step: stepNumber })
                });
                const res = await req.json();
                if (res.status === "success") {
                    status.innerHTML = `<i class="fa-solid fa-check"></i> ¡Alumnos desbloqueados en el Paso ${stepNumber}!`;
                }
            } catch (e) {
                status.innerHTML = `<span class="text-red-400">Error de red. Intenta de nuevo.</span>`;
            }
        }
    </script>
</body>
</html>
